
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi Image Wallpaper</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    .wallpaper {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #111;
    }

    .wallpaper img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Image layers */
    .wallpaper img:nth-child(1) {
      z-index: 1;
    }

    .wallpaper img:nth-child(2) {
      z-index: 2;
      /* opacity: 0.5; */
      /* mix-blend-mode: screen; */
    }

    .wallpaper img:nth-child(3) {
      z-index: 3;
      /* opacity: 0.3; */
      /* mix-blend-mode: overlay; */
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .wallpaper img {
        object-position: center;
      }
    }
  </style>
</head>

<body>

  <div class="wallpaper">
       <img src="image/sky.png" alt="Wallpaper layer 1" />
    <img src="image/ground.png" alt="Wallpaper layer 2" /> 

    <!-- <img src="images/image3.jpg" alt="Wallpaper layer 3" /> -->
  </div>

</body>
</html>
